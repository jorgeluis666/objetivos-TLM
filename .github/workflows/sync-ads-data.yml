name: Sincronizar datos de Meta Ads desde Drive

# Descarga las hojas mensuales de Meta Ads y la carpeta de reportes de Drive, regenera data/tlm-ads-2026.json,
# data/tlm-ads-daily.json (Generador de reporte semanal) y data/tlm-drive-reports.json (Archivo de Reportes) y
# los publica en main (GitHub Pages los sirve al cliente). Corre solo tres veces al dia y a pedido: el boton
# "Sincronizar con Drive" del tablero lo lanza por el Web App scripts/sync-trigger.gs.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12,17,22 * * *' # 7:00 a. m., 12:00 m. y 5:00 p. m. hora de Lima

permissions:
  contents: write

concurrency:
  group: sync-ads-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias
        run: pip install --disable-pip-version-check -q openpyxl requests

      # Sin credenciales: las carpetas de Drive estan compartidas por enlace (solo lectura).
      - name: Descargar las carpetas de Drive
        run: python scripts/drive-download.py --out "$RUNNER_TEMP/tlm"

      - name: Regenerar data/tlm-ads-2026.json y data/tlm-ads-daily.json
        run: python scripts/build-ads-data.py --root "$RUNNER_TEMP/tlm"

      - name: Actualizar el catalogo de Archivo de Reportes
        run: python scripts/update-reports-catalog.py --root "$RUNNER_TEMP/tlm"

      - name: Publicar en main
        run: |
          git config user.name "tlm-sync[bot]"
          git config user.email "tlm-sync@users.noreply.github.com"
          # syncedAt cambia en cada corrida y es lo que el boton del tablero espera para saber que termino:
          # a pedido se publica siempre. Las corridas automaticas solo publican si cambio algo mas.
          DATA="data/tlm-ads-2026.json data/tlm-ads-daily.json data/tlm-drive-reports.json"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && git diff --quiet -I '"(syncedAt|generatedAt)"' -- $DATA; then
            echo "Sin cambios en los datos."
            exit 0
          fi
          git add $DATA
          git commit -m "data: sincronizacion desde Drive ($(date -u +%Y-%m-%dT%H:%MZ))" || exit 0
          git push
